name: Android build

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to attach the APK to
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build release and test APKs
        run: ./gradlew --no-daemon --stacktrace assembleRelease assembleDebug

      - name: Upload unsigned release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug-signed test APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  attach-release-apk:
    name: Attach APK to GitHub Release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download unsigned release APK
        uses: actions/download-artifact@v8
        with:
          name: android-release-apk
          path: dist/release

      - name: Download debug-signed test APK
        uses: actions/download-artifact@v8
        with:
          name: android-debug-apk
          path: dist/debug

      - name: Attach APKs to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" dist/debug/app-debug.apk dist/release/app-release-unsigned.apk --clobber --repo "$GH_REPO"
