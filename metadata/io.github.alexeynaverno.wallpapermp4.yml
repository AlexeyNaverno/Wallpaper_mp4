AutoName: MP4 Live Wallpaper
Summary: Loop MP4 videos as live wallpapers and provide their colors to Android
Description: |-
  Set an MP4 video as a live wallpaper and let Android derive a system palette from it.

  The app samples five frames from the selected video, calculates primary, secondary and tertiary colors with Android WallpaperColors, and supplies them to the live-wallpaper service. It notifies the system when the selected video or palette changes.

  Videos are selected using Android's document picker. The app retains access only to the chosen file, does not copy the video, and has no network permission. Playback is silent and loops while the live wallpaper is visible.

  Requires Android 8.1 (API 27) or newer and a video format supported by the device's Android MediaPlayer. Dynamic-color behavior depends on the Android ROM and SystemUI.

