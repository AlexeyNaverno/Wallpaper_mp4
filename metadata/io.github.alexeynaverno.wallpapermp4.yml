AutoName: MP4 Live Wallpaper
Summary: Create silent MP4 ping-pong wallpapers and save them as templates
Description: |-
  Import an MP4 and create a reusable silent live-wallpaper template. The app decodes the source frames and encodes one H.264 MP4 in the order 0…N−1, N−2…1, excluding the first and last endpoint frames on the reverse pass.

  Generated videos keep the source resolution, contain no audio and are stored in an in-app private library. The live-wallpaper service plays the prepared MP4 with Android MediaPlayer looping, so it does not decode frames in reverse while the wallpaper is visible. Template creation takes time and temporary storage; the result is about twice the source duration. Users can select or delete saved templates.

  The app samples five frames from each source video and calculates primary, secondary and tertiary colors with Android WallpaperColors. The live-wallpaper service returns the palette to the system and calls notifyColorsChanged() when the selection changes.

  Videos are selected using Android's document picker. Read access is released after processing. Generated files stay in the app's private storage. The app has no network permission. Requires Android 8.1 (API 27) or newer and platform support for decoding the source video and encoding H.264. Dynamic-color behavior depends on the Android ROM and SystemUI.

