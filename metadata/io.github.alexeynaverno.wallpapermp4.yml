AutoName: MP4 Live Wallpaper
Summary: Silent MP4 ping-pong live wallpapers with video-derived Android colors
Description: |-
  Set an MP4 video as a silent live wallpaper. It plays forward and then backward, excluding the endpoint frames on the reverse pass to avoid a jump from the end back to the beginning.

  Android MediaPlayer handles forward playback. During the reverse pass, the app retrieves scaled frames one at a time using MediaMetadataRetriever and draws them to the wallpaper surface. Reverse rendering is limited to 30 frame lookups per second and a 1080-pixel long edge. If the device cannot retrieve frames for a video, playback falls back to a normal forward loop.

  The app samples five video frames and calculates primary, secondary and tertiary colors with Android WallpaperColors. The live-wallpaper service returns these colors to the system and calls notifyColorsChanged() when the selection changes.

  Videos are selected using Android's document picker. The app retains access only to the chosen file, does not copy the video and has no network permission. Requires Android 8.1 (API 27) or newer. Dynamic-color behavior depends on the Android ROM and SystemUI.

